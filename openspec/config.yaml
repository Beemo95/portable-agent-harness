schema: spec-driven
context: |
  Target Godot 4.7+ within 4.x (not pinned to 4.7.2); inspect the real
  installed editor version, APIs and addons before work. Report pre-4.7 or
  major-version mismatches; never upgrade the user's project silently.
  Documentation-first, Git-native game development. Read actual existing code,
  tests, project version and relevant prior domain knowledge before planning.
  Investigate factual unknowns; ask the user only for material product choices,
  conflicting requirements or unsafe blockers. Significant work uses one
  OpenSpec change with ordered independently testable implementation phases.
  Each phase has acceptance, relevant source paths, dependencies, regression
  tests, real runtime/visual/device QA when applicable, and required completion
  gates. Failed or NOT RUN required gates block phase completion; do not fake PASS.
  Distill reusable verified knowledge into one canonical spec, architecture, ADR
  or research document. .agent-docs/topics.md stores pointers, not duplicated facts.
  STATUS describes current work only; older knowledge remains searchable.
  This repository is a template without a running Godot game.
rules:
  proposal:
    - Include current code baseline, accepted behavior, decision questions and risks.
  tasks:
    - Organize significant changes into testable phases with required gates and next action.
