schema: spec-driven
context: |
  Portable Agent Harness is a Git-native, Markdown-first documentation template.
  AGENTS.md routes to task-specific guidance; .agent-docs/status.md points to current work.
  OpenSpec owns approved requirements, change design and the one implementation checklist.
  Decisions, research and real verification evidence stay in Git-tracked Markdown.
  No Python CLI, SQLite cache, duplicate task database or generated context packet.
  Reconcile status with actual source and tests; never misrepresent missing visual QA.
rules:
  proposal:
    - Define observable acceptance, failure cases, compatibility and rollback.
  tasks:
    - Include relevant verification and a short handoff for session changes.
