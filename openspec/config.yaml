schema: spec-driven
context: |
  Git-native Godot work uses AGENTS.md, .agent-docs/status.md, actual code/Git,
  and one canonical OpenSpec implementation checklist per change.
  Checkpoint significant decisions, implemented slices, failures and session/context changes.
  Do not duplicate plans in a task database or change acceptance to claim success.
  This template includes no actual game, so runtime/device tests are NOT RUN.
rules:
  proposal:
    - State observable acceptance criteria, risks and compatibility.
  tasks:
    - Include relevant verification and a factual next-session handoff.
