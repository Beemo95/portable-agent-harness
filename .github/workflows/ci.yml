name: Documentation smoke check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical files exist
        shell: bash
        run: |
          set -euo pipefail
          for p in AGENTS.md README.md .agent-docs/status.md .agent-docs/index.md .agent-docs/rules/workflow.md openspec/config.yaml .agents/skills/context-recovery/SKILL.md; do
            test -f "$p" || { echo "Missing $p"; exit 1; }
          done
      - name: Ensure legacy runtime remains removed
        shell: bash
        run: |
          set -euo pipefail
          for p in harness tests scripts .harness project.harness.json mise.toml; do
            test ! -e "$p" || { echo "Legacy runtime path exists: $p"; exit 1; }
          done
