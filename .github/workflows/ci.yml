name: Documentation integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of validation scripts
        run: bash -n scripts/check-docs.sh tests/docs-lint.sh
      - name: Internal docs links and active work pointers
        run: bash scripts/check-docs.sh
      - name: Negative tests
        run: bash tests/docs-lint.sh
# Real games can and should contain their own tests/ and scripts/.
