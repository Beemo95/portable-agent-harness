name: Harness integrity
on:
  push:
  pull_request:
  schedule:
    # Every Monday: flag review deadlines without claiming source content was refreshed.
    - cron: '17 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell script syntax
        run: bash -n scripts/check-docs.sh tests/docs-lint.sh
      - name: Check instructions, OpenSpec pointers, docs, source review deadline
        run: bash scripts/check-docs.sh
      - name: Negative regression tests
        run: bash tests/docs-lint.sh
# Does not run a Godot game or prove an agent obeys instructions.
