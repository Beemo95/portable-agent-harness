# OPTIONAL developer convenience. Plain Python + Git remain the minimum.
# Review mise.toml and any task commands before 'mise trust' or 'mise run'.
[tools]
python = "3.12"
node = "22"

[tasks.doctor]
run = "python scripts/harness.py doctor"

[tasks.lint]
run = "python scripts/harness.py lint"

[tasks.test]
run = "python -m unittest discover -s tests -v"

[tasks.verify]
run = "python scripts/harness.py verify"
